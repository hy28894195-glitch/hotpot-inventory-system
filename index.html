

<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>火锅店报货系统</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#f6f6f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}

header{background:white;padding:20px;text-align:center}

h1{font-size:23px;margin:0}

.tip{color:#888;font-size:13px;margin-top:8px}

nav{display:flex;background:white;position:sticky;top:0;z-index:2;border-bottom:1px solid #ddd}

nav button{flex:1;padding:15px 2px;border:0;background:white;font-size:15px;color:#555}

nav button.on{color:#b73535;border-bottom:3px solid #b73535;font-weight:bold}

main{max-width:680px;margin:auto;padding:14px}

.card{background:white;border:1px solid #e7e7e7;border-radius:17px;padding:16px;margin-bottom:14px}

h2{font-size:20px;margin:0 0 14px}

h3{font-size:17px;margin:12px 0}

.muted{color:#888;font-size:13px}

.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0}

.cat{border:1px solid #ddd;background:#f5f5f5;border-radius:12px;padding:12px 2px;text-align:center;font-size:13px}

.cat span{display:block;font-size:27px;margin-bottom:6px}

.cat.on{border:2px solid #b73535;background:#fff3f3}

.item{display:flex;align-items:center;gap:8px;padding:13px 0;border-bottom:1px solid #eee}

.info{flex:1;min-width:0}

.name{font-size:16px;font-weight:600}

.item input{width:67px;padding:10px 4px;border:1px solid #ddd;border-radius:9px;text-align:center;font-size:16px}

button{cursor:pointer}

.small{background:white;border:1px solid #ddd;border-radius:9px;padding:9px 11px;color:#333}

.primary{background:#b73535;border:0;border-radius:10px;color:white;padding:13px;font-size:16px}

.full{width:100%;margin-top:12px}

.field{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;background:white;font-size:16px;margin:6px 0 12px}

.line{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:12px 0}

.line:last-child{border:0}

.tag{background:#f1f1f1;border-radius:20px;padding:5px 8px;font-size:12px}

.empty{text-align:center;color:#999;padding:25px 0}

.warn{color:#c0392b}

.ok{color:#23824c}

.actions{display:flex;gap:8px;margin-top:12px}

.actions button{flex:1}

footer{text-align:center;color:#999;font-size:12px;padding:18px}

</style>

</head>

<body>

<header>

<h1>🍲 火锅店报货系统</h1>

<div class="tip">门店报货 · 库房管理 · 缺货采购</div>

</header>

<nav>

<button id="nav-store" class="on" onclick="go('store')">门店报货</button>

<button id="nav-warehouse" onclick="go('warehouse')">库房管理</button>

<button id="nav-purchase" onclick="go('purchase')">缺货采购</button>

</nav>

<main id="app"></main>

<footer>演示版：数据仅保存在当前浏览器</footer>

<script>

const goods={

"素菜":[

["生菜","斤"],["菠菜","斤"],["娃娃菜","包"],

["茼蒿","斤"],["土豆","斤"],["藕片","斤"],

["金针菇","包"],["香菇","斤"]

],

"荤菜":[

["先锋上脑","斤"],["肥牛","盒"],["牛肉","斤"],

["毛肚","斤"],["鸭肠","斤"],["黄喉","斤"],

["鸭血","盒"],["鲜虾","斤"]

],

"干货":[

["腐竹","袋"],["宽粉","袋"],["木耳","袋"],

["粉丝","袋"],["海带","袋"]

],

"调料":[

["牛油底料","件"],["菌汤底料","件"],

["清油底料","件"],["芝麻酱","桶"],

["辣椒面","袋"],["花椒","斤"],

["食盐","袋"],["味精","袋"]

],

"冻货":[

["肥肠","件"],["虾滑","袋"],["冻丸子","袋"],

["冻鸭血","盒"],["鱼豆腐","袋"],

["牛肉丸","袋"],["冻虾","盒"],

["冻鸭脖","件"]

]

};

const emoji={

"素菜":"🥬","荤菜":"🥩","干货":"🍄",

"调料":"🧂","冻货":"🧊"

};

const KEY="hotpot_demo_v4";

let data;

try{

data=JSON.parse(localStorage.getItem(KEY))||{};

}catch(e){data={}}

data.cart=data.cart||{};

data.orders=data.orders||[];

data.stock=data.stock||{};

data.purchase=data.purchase||[];

data.logs=data.logs||[];

let tab="store";

let category="冻货";

function save(){

localStorage.setItem(KEY,JSON.stringify(data));

}

function safe(s){

return String(s).replace(/[&<>"']/g,c=>({

"&":"&amp;","<":"&lt;",">":"&gt;",

'"':"&quot;","'":"&#39;"

})[c]);

}

function allGoods(){

return Object.entries(goods).flatMap(([cat,arr])=>

arr.map(([name,unit])=>({cat,name,unit})));

}

function unit(name){

let x=allGoods().find(g=>g.name===name);

return x?x.unit:"";

}

function options(){

return allGoods().map(g=>

`<option value="${safe(g.name)}">${safe(g.name)}（${g.unit}）</option>`

).join("");

}

function go(t){

tab=t;

document.querySelectorAll("nav button").forEach(b=>

b.classList.toggle("on",b.id==="nav-"+t));

render();

window.scrollTo(0,0);

}

function render(){

if(tab==="store")store();

if(tab==="warehouse")warehouse();

if(tab==="purchase")purchasePage();

}

function choose(c){

category=c;

render();

}

function add(name){

let el=document.getElementById("q-"+name);

let n=Number(el.value);

if(!Number.isInteger(n)||n<=0){

alert("请输入大于0的整数数量");

return;

}

data.cart[name]=(data.cart[name]||0)+n;

save();

render();

}

function remove(name){

delete data.cart[name];

save();

render();

}

function store(){

let html=`<div class="card">

<h2>门店报货</h2>

<div class="muted">选择分类 → 填数量 → 加入清单</div>

<div class="categories">`;

Object.keys(goods).forEach(c=>{

html+=`<button class="cat ${category===c?"on":""}"

onclick="choose('${c}')">

<span>${emoji[c]}</span>${c}</button>`;

});

html+=`</div><h3>${category}商品</h3>`;

goods[category].forEach(([name,u])=>{

html+=`<div class="item">

<div class="info">

<div class="name">${safe(name)}</div>

<div class="muted">单位：${u}</div>

</div>

<input id="q-${safe(name)}" type="number" min="1" step="1" placeholder="数量">

<button class="small" onclick="add('${name}')">添加</button>

</div>`;

});

html+=`</div><div class="card"><h2>今日报货清单</h2>`;

let list=Object.entries(data.cart);

if(!list.length){

html+=`<div class="empty">还没有添加商品</div>`;

}

list.forEach(([name,n])=>{

html+=`<div class="line">

<span>${safe(name)} × ${n}${unit(name)}</span>

<button class="small" onclick="remove('${name}')">删除</button>

</div>`;

});

html+=`<p class="muted">已选择 ${list.length} 种商品</p>

<button class="primary full" onclick="submitOrder()">提交报货单</button>

</div>`;

document.getElementById("app").innerHTML=html;

}

function submitOrder(){

if(!Object.keys(data.cart).length){

alert("请先添加商品");return;

}

if(!confirm("确定提交报货单吗？"))return;

data.orders.unshift({

id:"BH"+Date.now(),

time:new Date().toLocaleString("zh-CN"),

status:"待审核",

items:{...data.cart}

});

data.cart={};

save();render();

alert("报货单已保存，可在库房管理中查看");

}

function audit(id){

let o=data.orders.find(x=>x.id===id);

if(!o||o.status!=="待审核")return;

o.status="已审核";

save();render();

}

function deliver(id){

let o=data.orders.find(x=>x.id===id);

if(!o||o.status!=="已审核")return;

let missing=[];

Object.entries(o.items).forEach(([name,n])=>{

let have=data.stock[name]||0;

if(have<n)missing.push(name+" 缺 "+(n-have)+unit(name));

});

if(missing.length){

alert("库存不足：\n"+missing.join("\n")+"\n请先采购并入库");

return;

}

Object.entries(o.items).forEach(([name,n])=>{

data.stock[name]-=n;

data.logs.unshift({

time:new Date().toLocaleString("zh-CN"),

type:"报货出库",name,qty:n

});

});

o.status="已出库";

save();render();

alert("出库成功");

}

function stockChange(type){

let name=document.getElementById("stockName").value;

let n=Number(document.getElementById("stockQty").value);

if(!Number.isInteger(n)||n<=0){

alert("请输入正确的整数数量");return;

}

let old=data.stock[name]||0;

if(type==="出库"&&old<n){

alert("库存不足");return;

}

data.stock[name]=old+(type==="入库"?n:-n);

data.logs.unshift({

time:new Date().toLocaleString("zh-CN"),

type,name,qty:n

});

save();render();

alert(type+"成功");

}

function warehouse(){

let pending=data.orders.filter(o=>o.status==="待审核").length;

let html=`<div class="card">

<h2>库房管理</h2>

<p>待审核报货单：<b>${pending}</b> 单</p>

</div>

<div class="card"><h2>门店报货单</h2>`;

if(!data.orders.length){

html+=`<div class="empty">暂无报货单</div>`;

}

data.orders.forEach(o=>{

html+=`<div style="padding:12px 0;border-bottom:1px solid #eee">

<b>${safe(o.id)}</b>

<span class="tag">${o.status}</span>

<p class="muted">${safe(o.time)}</p>`;

Object.entries(o.items).forEach(([name,n])=>{

html+=`<div class="line"><span>${safe(name)}</span>

<span>${n}${unit(name)}</span></div>`;

});

if(o.status==="待审核"){

html+=`<button class="primary full" onclick="audit('${o.id}')">审核通过</button>`;

}

if(o.status==="已审核"){

html+=`<button class="primary full" onclick="deliver('${o.id}')">确认出库</button>`;

}

html+=`</div>`;

});

html+=`</div>

<div class="card">

<h2>商品入库 / 出库</h2>

<label>选择商品</label>

<select class="field" id="stockName">${options()}</select>

<label>数量</label>

<input class="field" id="stockQty" type="number" min="1" step="1" placeholder="请输入数量">

<div class="actions">

<button class="primary" onclick="stockChange('入库')">确认入库</button>

<button class="small" onclick="stockChange('出库')">确认出库</button>

</div>

</div>

<div class="card"><h2>当前库存</h2>`;

allGoods().forEach(g=>{

let n=data.stock[g.name]||0;

html+=`<div class="line"><span>${safe(g.name)}</span>

<span class="${n===0?"warn":""}">${n}${g.unit}</span></div>`;

});

html+=`</div><div class="card"><h2>最近出入库记录</h2>`;

if(!data.logs.length)html+=`<div class="empty">暂无记录</div>`;

data.logs.slice(0,30).forEach(l=>{

html+=`<div class="line"><div>${safe(l.type)} · ${safe(l.name)}

<div class="muted">${safe(l.time)}</div></div>

<b>${l.qty}${unit(l.name)}</b></div>`;

});

html+=`</div>`;

document.getElementById("app").innerHTML=html;

}

function addPurchase(){

let name=document.getElementById("purchaseName").value;

let n=Number(document.getElementById("purchaseQty").value);

if(!Number.isInteger(n)||n<=0){

alert("请输入正确的采购数量");return;

}

data.purchase.unshift({

id:"CG"+Date.now(),

name,qty:n,status:"待采购",

time:new Date().toLocaleString("zh-CN")

});

save();render();

alert("已加入采购清单");

}

function finishPurchase(id){

let p=data.purchase.find(x=>x.id===id);

if(!p||p.status!=="待采购")return;

if(!confirm("确认商品已经到货并入库？"))return;

data.stock[p.name]=(data.stock[p.name]||0)+p.qty;

data.logs.unshift({

time:new Date().toLocaleString("zh-CN"),

type:"采购入库",name:p.name,qty:p.qty

});

p.status="已入库";

save();render();

}

function purchasePage(){

let html=`<div class="card">

<h2>缺货采购</h2>

<div class="muted">填写缺货商品和采购数量</div>

<h3>新增采购商品</h3>

<select class="field" id="purchaseName">${options()}</select>

<input class="field" id="purchaseQty" type="number" min="1" step="1" placeholder="采购数量">

<button class="primary full" onclick="addPurchase()">加入采购清单</button>

</div>

<div class="card"><h2>采购清单</h2>`;

if(!data.purchase.length){

html+=`<div class="empty">暂无采购记录</div>`;

}

data.purchase.forEach(p=>{

html+=`<div style="border-bottom:1px solid #eee;padding:12px 0">

<div class="line"><b>${safe(p.name)}</b>

<span>${p.qty}${unit(p.name)}</span></div>

<div class="muted">${safe(p.time)} · ${p.status}</div>`;

if(p.status==="待采购"){

html+=`<button class="primary full" onclick="finishPurchase('${p.id}')">确认到货并入库</button>`;

}

html+=`</div>`;

});

html+=`</div><div class="card"><h2>零库存提醒</h2>`;

let zero=allGoods().filter(g=>(data.stock[g.name]||0)===0);

if(!zero.length)html+=`<div class="ok">目前没有零库存商品</div>`;

zero.forEach(g=>{

html+=`<div class="line"><span>${safe(g.name)}</span>

<span class="warn">库存 0${g.unit}</span></div>`;

});

html+=`</div>`;

document.getElementById("app").innerHTML=html;

}

render();

</script>

</body>

</html>
